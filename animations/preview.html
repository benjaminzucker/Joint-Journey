<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joint Journey - Exercise animation samples (draft)</title>
  <style>
    body { margin: 0; padding: 24px 16px 48px; background: #F5F3EC; color: #2F3B37;
           font-family: Inter, -apple-system, 'Segoe UI', Arial, sans-serif; line-height: 1.5; }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { color: #475953; margin: 0 0 4px; }
    .note { background: #FFF4E5; border-left: 4px solid #FF8F00; padding: 10px 14px; border-radius: 6px; max-width: 760px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 20px; margin-top: 24px; }
    .card h2 { font-size: 1.15rem; margin: 0 0 8px; color: #475953; }
    .card .desc { font-size: .9rem; color: #5B6B66; margin: 10px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Exercise animation samples</h1>
    <p class="note"><strong>Draft for review - not live in the app.</strong> Original Joint Journey artwork, no third-party footage.
      Each animation needs physiotherapy advisor sign-off before patients see it (Hazard Log H01).</p>
    <div class="grid" id="grid"></div>
  </main>
  <script src="jj-anim-core.js"></script>
  <script src="jj-anim-props.js"></script>
  <script src="jj-anim-shapes.js"></script>
  <script src="jj-anim-character.js"></script>
  <script src="ex-ankle-pumps.js"></script>
  <script src="ex-static-quad-sets.js"></script>
  <script src="ex-inner-range-quad-hold.js"></script>
  <script src="ex-straight-leg-raise.js"></script>
  <script src="ex-bridging.js"></script>
  <script src="ex-seated-knee-extension.js"></script>
  <script src="ex-seated-marching.js"></script>
  <script src="ex-seated-heel-slides.js"></script>
  <script src="ex-chair-sit-to-stand.js"></script>
  <script src="ex-standing-hip-extension.js"></script>
  <script src="ex-heel-raises.js"></script>
  <script src="ex-standing-knee-bend.js"></script>
  <script src="ex-standing-march.js"></script>
  <script src="ex-kitchen-worktop-press-ups.js"></script>
  <script src="ex-heel-to-toe-walking.js"></script>
  <script src="ex-step-ups.js"></script>
  <script src="ex-single-leg-balance.js"></script>
  <script src="ex-tandem-standing.js"></script>
  <script src="ex-floor-transfer.js"></script>
  <script src="jj-anim-player.js"></script>
  <script>
    // ?freeze=0.4 shows a still frame; ?only=key1,key2 limits the cards (both used for review screenshots)
    var q = new URLSearchParams(location.search);
    var f = parseFloat(q.get('freeze'));
    var opts = isNaN(f) ? {} : { freeze: f };
    var keys = q.get('only') ? q.get('only').split(',') : JJAnimations.list();
    var grid = document.getElementById('grid');
    keys.forEach(function (key) {
      var card = document.createElement('section');
      card.className = 'card';
      var h = document.createElement('h2');
      h.textContent = JJAnimations.title(key);
      var box = document.createElement('div');
      card.appendChild(h);
      card.appendChild(box);
      grid.appendChild(card);
      JJAnimations.mount(box, key, opts);
    });
  </script>
</body>
</html>
